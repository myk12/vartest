name: baseline_line_rate
version: 1
scene: line_rate_fpga
notes: "Near line-rate bidirectional test at ports 30 and 31"
duration_s: 60
flows:
  - exp_id: 100
    src_port: 30
    dst_port: 31
    rate_gbps: 95
    pkt_mix:  # percentage mix for variable packet sizes
      - { size: 64, pct: 70 }
      - { size: 512, pct: 30 }
    udp_dst_port: 12345
  - exp_id: 101
    src_port: 31
    dst_port: 30
    rate_gbps: 95
    pkt_mix:
      - { size: 64, pct: 70 }
      - { size: 512, pct: 30 }
    udp_dst_port: 12345
capture:
  enabled: true
  interface: enp1s0f0
  bpf: "udp and port 12345"
