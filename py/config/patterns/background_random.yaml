name: background_random
version: 1
scene: random_background
notes: "Ports 24-29 generate random shuffled background while 30/31 carry experiment flows"
duration_s: 60
epoch_s: 2
experiment_flows:
  - exp_id: 100
    src_port: 30
    dst_port: 31
    rate_gbps: 20
    pkt_bytes: 256
    udp_dst_port: 12345
  - exp_id: 101
    src_port: 31
    dst_port: 30
    rate_gbps: 20
    pkt_bytes: 256
    udp_dst_port: 12345
background_ports: [24,25,26,27,28,29]
background_rate_gbps: 15
background_pkt_mix:
  - { size: 64, pct: 50 }
  - { size: 512, pct: 50 }
timestamp_background: false
capture:
  enabled: true
  interface: enp1s0f0
  bpf: "udp and port 12345"
