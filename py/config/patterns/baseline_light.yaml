name: baseline_light
version: 1
scene: light_load_fpga
notes: "Low utilization bidirectional baseline between ports 30 and 31"
duration_s: 60
flows:
  - exp_id: 100
    src_port: 30
    dst_port: 31
    rate_gbps: 5
    pkt_bytes: 512
    udp_dst_port: 12345
  - exp_id: 101
    src_port: 31
    dst_port: 30
    rate_gbps: 5
    pkt_bytes: 512
    udp_dst_port: 12345
capture:
  enabled: true
  interface: enp1s0f0
  bpf: "udp and port 12345"
